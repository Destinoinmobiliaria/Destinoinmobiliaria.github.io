<!DOCTYPE html>

<meta name="description" content="Inmuebles verificados en Barbosa, Antioquia. En un solo mapa.">
<meta name="theme-color" content="#000000">

<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('destino:tema'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);

    /* Light Mode (Apple Daylight) */
    --bg: #f5f5f7;
    --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f5f5f7 65%);
    --surface: rgba(255, 255, 255, 0.65);
    --surface-elevated: rgba(255, 255, 255, 0.82);
    --surface-2: rgba(118, 118, 128, 0.12);
    --ink: #1d1d1f;
    --muted: #86868b;
    --line: rgba(0, 0, 0, 0.08);
    --glass-border: rgba(255, 255, 255, 0.65);
    --accent: #0071e3;
    --on-accent: #ffffff;
    --live: #30d158;
    --focus: rgba(0, 113, 227, 0.45);
    --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.14);
    --hh: 140px;
  }

  [data-theme="dark"] {
    /* Dark Mode (Apple Midnight) */
    --bg: #000000;
    --bg-gradient: radial-gradient(circle at 50% 0%, #16181d 0%, #000000 70%);
    --surface: rgba(28, 28, 30, 0.58);
    --surface-elevated: rgba(38, 38, 42, 0.78);
    --surface-2: rgba(118, 118, 128, 0.24);
    --ink: #f5f5f7;
    --muted: #86868b;
    --line: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.16);
    --accent: #0a84ff;
    --on-accent: #ffffff;
    --live: #30d158;
    --focus: rgba(10, 132, 255, 0.5);
    --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.35);
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.75);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    font-weight: 400;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; user-select: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ic { flex: none; transition: transform 0.4s var(--ease); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* ---------- Navigation & Glass Header ---------- */
  .top {
    position: sticky; top: 0; z-index: 500;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: var(--shadow-sm);
    transition: all 0.4s var(--ease);
  }
  .bar {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 24px;
    max-width: 1440px; margin: 0 auto; padding: 14px 32px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    background: none; border: 0; padding: 4px 0; text-align: left;
    transition: all 0.4s var(--ease);
  }
  .brand:hover { transform: scale(1.02); opacity: 0.9; }
  .brand:active { transform: scale(0.97); }
  .brand .mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
  }
  .brand b { font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; display: block; }
  .brand small { color: var(--muted); font-size: 12px; font-weight: 500; display: block; margin-top: 2px; }

  /* ---------- Glass Search Bar ---------- */
  .search {
    display: flex; align-items: center; gap: 10px;
    max-width: 520px; width: 100%; margin: 0 auto;
    background: var(--surface-2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 5px 6px 5px 18px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: all 0.4s var(--ease);
  }
  .search:hover { background: var(--surface-elevated); box-shadow: var(--shadow-sm); }
  .search:focus-within {
    background: var(--surface-elevated);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--focus), var(--shadow-sm);
    transform: scale(1.01);
  }
  .search input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: 0;
    padding: 6px 0; font-size: 15px; font-weight: 400;
  }
  .search input::placeholder { color: var(--muted); }
  .go {
    width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center;
    transition: all 0.4s var(--ease);
  }
  .go:hover { transform: scale(1.06); filter: brightness(1.08); }
  .go:active { transform: scale(0.94); }

  /* ---------- Glass Buttons ---------- */
  .tools { display: flex; align-items: center; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    color: var(--ink);
    border-radius: 999px; padding: 9px 18px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-sm);
    transition: all 0.4s var(--ease);
  }
  .btn:hover {
    transform: scale(1.03);
    background: var(--surface-elevated);
    box-shadow: var(--shadow);
  }
  .btn:active { transform: scale(0.96); }
  .btn.solid {
    background: var(--accent);
    color: var(--on-accent);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 6px 20px rgba(0, 113, 227, 0.28);
  }
  .btn.solid:hover {
    background: var(--accent);
    filter: brightness(1.08);
    box-shadow: 0 8px 26px rgba(0, 113, 227, 0.4);
  }
  .btn .ic { color: var(--ink); opacity: 0.85; }
  .btn.solid .ic { color: var(--on-accent); opacity: 1; }
  .btn.round { padding: 0; width: 40px; height: 40px; }
  .btn[aria-pressed="true"] {
    background: var(--ink); color: var(--bg);
    border-color: var(--ink);
  }
  .btn[aria-pressed="true"] .ic { color: var(--bg); fill: var(--bg); }
  .badge {
    background: var(--accent); color: var(--on-accent);
    border-radius: 999px; font-size: 11px; font-weight: 600;
    padding: 0 7px; line-height: 18px;
  }

  /* ---------- Sub-bar: Categories & Segmented Control ---------- */
  .sub {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    max-width: 1440px; margin: 0 auto; padding: 4px 32px 14px;
  }
  .types { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 2px; }
  .types::-webkit-scrollbar { display: none; }
  .type {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid transparent;
    border-radius: 999px; padding: 7px 16px;
    color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap;
    transition: all 0.4s var(--ease);
  }
  .type .ic { width: 18px; height: 18px; opacity: 0.75; }
  .type:hover {
    color: var(--ink);
    background: var(--surface-2);
    transform: scale(1.03);
  }
  .type:active { transform: scale(0.96); }
  .type[aria-pressed="true"] {
    color: var(--ink);
    background: var(--surface-elevated);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-color: var(--glass-border);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  .type[aria-pressed="true"] .ic { color: var(--accent); opacity: 1; }

  .seg {
    display: flex;
    background: var(--surface-2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 3px;
  }
  .seg button {
    border: 0; background: transparent; border-radius: 999px;
    padding: 6px 16px; font-size: 13px; font-weight: 500; color: var(--muted);
    transition: all 0.4s var(--ease);
  }
  .seg button:hover { color: var(--ink); }
  .seg button:active { transform: scale(0.96); }
  .seg button[aria-pressed="true"] {
    background: var(--surface-elevated);
    color: var(--ink);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  /* ---------- Hero & Home Layout ---------- */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  .intro {
    padding: 84px 0 48px;
    max-width: 820px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .intro h1 {
    font-size: clamp(40px, 6vw, 68px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin: 0 0 18px;
    background: linear-gradient(180deg, var(--ink) 0%, color-mix(in srgb, var(--ink) 70%, var(--muted)) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .intro p {
    margin: 0;
    color: var(--muted);
    font-size: clamp(18px, 2.2vw, 23px);
    line-height: 1.45;
    font-weight: 400;
    max-width: 48ch;
    letter-spacing: -0.015em;
  }
  .live {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 28px; padding: 8px 18px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    font-size: 13px; font-weight: 500; color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .live i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.2);
  }

  /* ---------- Content Rows ---------- */
  .row { padding: 48px 0 16px; }
  .row header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 24px;
  }
  .row h2 {
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .link {
    background: none; border: 0; color: var(--accent);
    font-size: 15px; font-weight: 500;
    padding: 4px 0;
    transition: all 0.4s var(--ease);
  }
  .link:hover { opacity: 0.75; transform: translateX(2px); }
  .link:active { transform: scale(0.96); }

  .rail {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 320px);
    gap: 28px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 12px 8px 32px; margin: -12px -8px 0;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; }

  /* ---------- Property Card ---------- */
  .card {
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 12px;
    cursor: pointer; min-width: 0;
    box-shadow: var(--shadow-sm);
    transition: all 0.4s var(--ease);
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-6px) scale(1.01);
    background: var(--surface-elevated);
    box-shadow: var(--shadow);
  }
  .card:active { transform: scale(0.98); }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus), var(--shadow); }

  .art {
    position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
    display: grid; place-items: center; color: rgba(255, 255, 255, 0.85);
  }
  .art img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.6s var(--ease);
  }
  .card:hover .art img { transform: scale(1.05); }

  .fav {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #ffffff; display: grid; place-items: center;
    transition: all 0.4s var(--ease);
  }
  .fav:hover { transform: scale(1.1); background: rgba(0, 0, 0, 0.55); }
  .fav:active { transform: scale(0.92); }
  .fav[aria-pressed="true"] { background: rgba(255, 55, 95, 0.9); border-color: transparent; color: #ffffff; }
  .fav[aria-pressed="true"] .ic { fill: currentColor; }

  .tag {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #1d1d1f;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
    padding: 4px 11px; border-radius: 999px;
  }

  .info { padding: 16px 8px 6px; display: flex; flex-direction: column; flex: 1; }
  .info h3 {
    font-size: 17px; font-weight: 600; line-height: 1.3;
    margin: 0; letter-spacing: -0.015em;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .where { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .specs {
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    margin: 12px 0; font-size: 13px; color: var(--muted);
  }
  .specs span { display: inline-flex; align-items: center; gap: 5px; }
  .specs .ic { color: var(--muted); opacity: 0.8; }
  .price {
    margin: auto 0 0;
    font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;
  }
  .price small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .ver {
    display: flex; align-items: center; gap: 6px;
    margin: 10px 0 0; padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .ver .ic { color: var(--live); }

  /* ---------- Split Results & Map ---------- */
  .split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 0; align-items: start; }
  .list { padding: 36px 32px 80px; }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
  }
  .list-head h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.03em; }
  .sort {
    border: 1px solid var(--glass-border);
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 999px; padding: 8px 16px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-sm);
    transition: all 0.4s var(--ease);
  }
  .sort:hover { background: var(--surface-elevated); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
  .mapbox { position: sticky; top: var(--hh); height: calc(100dvh - var(--hh)); padding: 16px 24px 24px 0; }
  #map {
    width: 100%; height: 100%;
    border-radius: 24px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
    background: var(--surface-2);
    overflow: hidden;
  }

  .empty { padding: 80px 0; max-width: 42ch; text-align: center; margin: 0 auto; }
  .empty h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 10px; }
  .empty p { color: var(--muted); font-size: 17px; margin: 0 0 24px; }

  /* ---------- Map Pins & Popups ---------- */
  .pin span {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #1d1d1f;
    font: 600 13px/1 var(--font-sans);
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    transition: all 0.4s var(--ease);
  }
  .pin.on { z-index: 1000 !important; }
  .pin.on span {
    background: var(--accent); color: #ffffff; border-color: transparent;
    transform: translate(-50%, -50%) scale(1.15);
    box-shadow: 0 8px 24px rgba(0, 113, 227, 0.45);
  }
  .leaflet-container { font-family: var(--font-sans); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--surface-elevated);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--ink);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
  }
  .leaflet-popup-content-wrapper { border-radius: 20px; }
  .leaflet-popup-content { margin: 14px 16px; min-width: 200px; }
  .pop b { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .pop span { color: var(--muted); font-size: 13px; display: block; margin: 2px 0 8px; }
  .pop strong { font-size: 17px; font-weight: 700; display: block; margin-bottom: 12px; letter-spacing: -0.02em; }
  .pop button {
    width: 100%; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-size: 13px; font-weight: 600; padding: 8px 14px;
    transition: all 0.4s var(--ease);
  }
  .pop button:hover { transform: scale(1.02); filter: brightness(1.08); }
  .pop button:active { transform: scale(0.97); }
  .leaflet-control-attribution {
    background: var(--surface) !important;
    backdrop-filter: blur(8px);
    color: var(--muted) !important;
    border-radius: 8px 0 0 0;
  }
  .leaflet-control-attribution a { color: var(--ink) !important; }

  .floating {
    display: none; position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 600;
    padding: 12px 24px; font-size: 15px;
    box-shadow: var(--shadow-lg);
  }
  .floating:hover { transform: translateX(-50%) scale(1.04); }
  .floating:active { transform: translateX(-50%) scale(0.96); }

  /* ---------- Glass Modals (Dialogs) ---------- */
  dialog {
    border: 1px solid var(--glass-border);
    padding: 0;
    background: var(--surface-elevated);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    color: var(--ink);
    border-radius: 28px;
    box-shadow: var(--shadow-lg);
    width: min(620px, calc(100vw - 32px));
    max-height: calc(100dvh - 40px);
    transition: all 0.4s var(--ease);
  }
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .dlg-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
    background: var(--surface-elevated);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 2;
  }
  .dlg-h h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .dlg-b { padding: 12px 28px 28px; }
  .dlg-f {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px 28px; border-top: 1px solid var(--line);
    position: sticky; bottom: 0;
    background: var(--surface-elevated);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blu
