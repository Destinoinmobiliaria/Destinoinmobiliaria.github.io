<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destino · Inmuebles en Barbosa, Antioquia</title>
    <style>
        /* --- ESTILOS BASE AL ESTILO APPLE --- */
        :root {
            --apple-bg: #f5f5f7;
            --apple-text-main: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-blue: #0071e3;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-blur: blur(20px);
        }

        /* Soporte para Modo Oscuro Automático del Sistema */
        @media (prefers-color-scheme: dark) {
            :root {
                --apple-bg: #000000;
                --apple-text-main: #f5f5f7;
                --apple-text-secondary: #86868b;
                --apple-blue: #2997ff;
                --glass-bg: rgba(22, 22, 23, 0.6);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            background-image: radial-gradient(circle at 80% 20%, rgba(0, 113, 227, 0.15), transparent 40%),
                              radial-gradient(circle at 10% 80%, rgba(163, 177, 138, 0.15), transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVBAR FLOTANTE ESTILO MAC --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
        }

        .logo {
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--apple-text-secondary);
            font-weight: 400;
        }

        /* --- HERO SECCIÓN PRINCIPAL --- */
        .hero {
            max-width: 800px;
            margin: 100px auto 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .hero p {
            font-size: 19px;
            color: var(--apple-text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* --- COMPONENTES GLASSMORPHISM (Filtros y Formularios) --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04);
            height: fit-content;
        }

        .glass-panel h2 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* --- BOTONES PREMIUM ESTILO APPLE GLASS --- */
        .btn-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--apple-text-main);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Botón de Acción Principal (Azul Apple) */
        .btn-primary {
            background: var(--apple-blue);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.4);
        }

        /* Segmented Control (Estilo interruptor nativo de iOS) */
        .segmented-control {
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 12px;
            display: flex;
            margin-bottom: 20px;
        }
        
        @media (prefers-color-scheme: dark) {
            .segmented-control { background: rgba(255, 255, 255, 0.1); }
        }

        .segmented-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.2s;
        }

        .segmented-item.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* --- ENTRADAS DE FORMULARIO --- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--apple-text-secondary);
            margin-bottom: 6px;
        }

        .input-apple {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--apple-text-main);
            font-size: 14px;
            transition: all 0.2s;
        }
        
        @media (prefers-color-scheme: dark) {
            .input-apple { background: rgba(0, 0, 0, 0.2); }
        }

        .input-apple:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
        }

        /* --- CUADRÍCULA DE INMUEBLES --- */
        .listings-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Tarjeta de Inmueble Estilo Apple Card */
        .property-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.08);
        }

        .property-thumb {
            width: 100%;
            height: 180px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--apple-text-secondary);
            font-size: 14px;
        }

        .property-content {
            padding: 20px;
        }

        .property-price {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .property-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .property-info {
            font-size: 13px;
            color: var(--apple-text-secondary);
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación Translúcido -->
    <header>
        <div class="logo">Destino <span>· Barbosa</span></div>
        <button class="btn-glass">Administrar</button>
    </header>

    <!-- Sección de Presentación Grande -->
    <section class="hero">
        <h1>Todo en un solo lugar.</h1>
        <p>Reunimos los inmuebles disponibles en Barbosa, Antioquia de múltiples inmobiliarias. Sin saltar entre redes sociales.</p>
    </section>

    <!-- Contenido Principal -->
    <main class="container">
        
        <!-- Columna Izquierda: Filtros (Panel de Cristal) -->
        <aside class="glass-panel">
            <h2>Filtros</h2>
            
            <div class="segmented-control">
                <div class="segmented-item active">Todo</div>
                <div class="segmented-item">Comprar</div>
                <div class="segmented-item">Arrendar</div>
